<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Issue Module</title>
    <!-- SheetJS CDN for Excel Upload -->

    <!-- Firebase App, Database & Analytics SDK (Compat Version) -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%;

            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);

            overflow: visible !important;
        }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        
        .header-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            width: 65%;
            min-width: 320px;
        }
        .header-group {
            position: relative;
        }
        .header-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .header-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        .header-group input:focus { border-color: #007bff; outline: none; background-color: #eef5ff; }

        .receiver-input-wrap {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .receiver-input-wrap input {
            flex: 1;
        }
        .new-receiver-btn {
            background-color: #0d6efd;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .new-receiver-btn:hover {

        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;

            color: white;

        }

        .eqp-add-btn:hover { background-color: #59339d; }
        .excel-upload-btn { background-color: #17a2b8; padding: 8px 14px; font-size: 13px; }
        .excel-upload-btn:hover { background-color: #138496; }
        .save-btn { background-color: #28a745; }
        .save-btn:hover { background-color: #218838; }

        .table-toolbar {

        }

        .table-footer-submit {

        .table-responsive {
            width: 100%;

        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 950px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
            position: relative; 
            overflow: visible !important;
        }
        th { background-color: #007bff; color: white; font-size: 14px; }
        
        .col-sl { width: 4%; }
        .col-item { width: 25%; }
        .col-qty { width: 9%; }
        .col-unit { width: 9%; }

        .col-hr { width: 9%; }
        .col-erp { width: 9%; }

        input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        input.eqp-uppercase {
            text-transform: uppercase;
        }
        input:focus { border-color: #007bff; outline: none; background-color: #eef5ff; }
        input.readonly-input { background-color: #e9ecef; cursor: not-allowed; font-weight: bold; }
        input.invalid { border-color: #dc3545; background-color: #fff8f8; }
        
        .suggestions-box {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%; 
            background: #fff;
            border: 1px solid #007bff;

            max-height: 300px; 
            overflow-y: auto;
            z-index: 999999;
            list-style: none;
            padding: 0;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
        }
        .suggestions-box li {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .suggestions-box li.active, .suggestions-box li:hover {

        }
        .stock-tag {
            font-size: 11px;

            color: #fff;

        .suggestions-box li.active .stock-tag,

        }
        .receiver-meta {

            color: #6c757d;
        }
        .suggestions-box li.active .receiver-meta,
        .suggestions-box li:hover .receiver-meta {

            border: none;
            padding: 5px 8px;
            border-radius: 4px;

            font-size: 12px;

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999999;
        }
        .custom-popup-box {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: popupScale 0.2s ease-in-out;
        }
        @keyframes popupScale {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-popup-box h3 { margin-top: 0; color: #28a745; font-size: 20px; }
        .custom-popup-box p { font-size: 14px; color: #555; margin: 12px 0 18px 0; white-space: pre-line; }
        .issue-no-badge {
            display: none;
            background: #f1f5f9;
            border: 2px dashed #28a745;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0 18px 0;
        }
        .issue-no-badge span.lbl {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .issue-no-badge span.val {
            font-size: 26px;
            font-weight: 800;
            color: #16a34a;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .custom-popup-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .custom-popup-btn:hover { background-color: #0056b3; }

        /* Form Modals (Receiver & Equipment) */
        .form-modal-box {
            background: #fff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 92%;
            text-align: left;
            animation: popupScale 0.2s ease-in-out;
        }
        .form-modal-box h3 {
            margin: 0 0 16px 0;
            color: #1e293b;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .modal-field {
            margin-bottom: 12px;
        }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        .modal-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .btn-cancel {
            background-color: #64748b;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-cancel:hover { background-color: #475569; }
        .btn-modal-save {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-modal-save:hover { background-color: #218838; }
        .btn-modal-save:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #back {
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            background-color: #2563eb;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }
        #back:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<!-- Custom Alert/Success Popup Modal -->
<div id="customPopupOverlay" class="modal-overlay">
    <div class="custom-popup-box">
        <h3 id="popupTitle">Success</h3>
        <p id="popupMessage">Message goes here...</p>
        <div id="issueNoBadge" class="issue-no-badge">
            <span class="lbl">Issue Posting No</span>
            <span id="popupIssueNo" class="val">ISS-00001</span>
        </div>
        <button type="button" class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
    </div>
</div>

<!-- New Receiver Modal -->
<div id="newReceiverModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Receiver</h3>
        <form id="newReceiverForm" onsubmit="saveNewReceiver(event)">
            <div class="modal-field">
                <label for="recNameInput">Name <span style="color: red;">*</span></label>
                <input type="text" id="recNameInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recDesignationInput">Designation <span style="color: red;">*</span></label>
                <input type="text" id="recDesignationInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recPhoneInput">Phone Number <span style="color: red;">*</span></label>
                <input type="tel" id="recPhoneInput" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewReceiverModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveReceiverBtn">Save Receiver</button>
            </div>
        </form>
    </div>
</div>

<!-- New Equipment Modal -->
<div id="newEquipmentModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Equipment</h3>
        <form id="newEquipmentForm" onsubmit="saveNewEquipment(event)">
            <div class="modal-field">
                <label for="eqpCodeInput">Equipment Number <span style="color: red;">*</span></label>
                <input type="text" id="eqpCodeInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="eqpNameInput">Equipment Name <span style="color: red;">*</span></label>

            <div class="modal-field">
                <label for="eqpModelInput">Model <span style="color: red;">*</span></label>
                <input type="text" id="eqpModelInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewEquipmentModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveEquipmentBtn">Save Equipment</button>
            </div>
        </form>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCQV_4nv_ohzevtZRxLj3Aq4kVafVEiLKw",
        authDomain: "tazul503.firebaseapp.com",
        databaseURL: "https://tazul503-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tazul503",
        storageBucket: "tazul503.firebasestorage.app",
        messagingSenderId: "190926921011",
        appId: "1:190926921011:web:77822854066e6a840f3246",
        measurementId: "G-GNHSXE22TQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let analytics = null;
    try {
        analytics = firebase.analytics();
    } catch (e) {
        console.warn("Analytics not available in this environment:", e);
    }

    let productDatabase = [];
    let receiverDatabase = [];
    let equipmentDatabase = [];

    const tbody = document.querySelector('#inventoryTable tbody');
    document.getElementById('entryDate').valueAsDate = new Date();

    function toUpperClean(val) {
        return val ? val.toString().toUpperCase() : "";
    }

    function formatEquipmentLabel(eq) {
        const code = toUpperClean(eq.code).trim();
        const name = toUpperClean(eq.name).trim();
        const model = toUpperClean(eq.model).trim();
        const parts = [name];
        if (model) parts.push(model);
        return `${code} (${parts.join(' - ')})`;
    }

    function validateAgainstDatabase(rawValue, type) {
        const cleaned = (rawValue || "").trim();
        if (!cleaned) {
            return { valid: false, value: "", record: null };
        }

        if (type === "receiver") {
            const matched = receiverDatabase.find(
                r => r.name.trim().toLowerCase() === cleaned.toLowerCase()
            );
            if (matched) {
                return { valid: true, value: matched.name.trim(), record: matched };
            }
            return { valid: false, value: cleaned, record: null };
        }

        if (type === "equipment") {
            const upperCleaned = toUpperClean(cleaned).trim();
            const matched = equipmentDatabase.find(eq => {
                const fullLabel = formatEquipmentLabel(eq).trim();
                const codeOnly = toUpperClean(eq.code).trim();
                return fullLabel === upperCleaned || codeOnly === upperCleaned;
            });
            if (matched) {
                return { valid: true, value: formatEquipmentLabel(matched), record: matched };
            }
            return { valid: false, value: upperCleaned, record: null };
        }

        return { valid: false, value: cleaned, record: null };
    }

    // Clear input value if it is not in receiver_list or equipment_list
    function clearIfUnlisted(inputEl, type) {
        if (!inputEl) return false;
        const currentVal = inputEl.value.trim();
        if (!currentVal) {
            inputEl.classList.remove('invalid');
            return false;
        }
        const check = validateAgainstDatabase(currentVal, type);
        if (!check.valid) {
            inputEl.value = "";
            inputEl.classList.remove('invalid');
            return true;
        }
        inputEl.value = check.value;
        inputEl.classList.remove('invalid');
        return false;
    }

    function isArrowOrEnterKey(key) {
        return key === 'Enter' || key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown';
    }

    function showCustomPopup(title, message, isSuccess = true, issueNo = "") {
        document.getElementById('popupTitle').textContent = title;
        document.getElementById('popupTitle').style.color = isSuccess ? '#28a745' : '#dc3545';
        document.getElementById('popupMessage').textContent = message;

        const badge = document.getElementById('issueNoBadge');
        if (issueNo) {
            document.getElementById('popupIssueNo').textContent = issueNo;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }

        document.getElementById('customPopupOverlay').style.display = 'flex';
    }

    function closeCustomPopup() {
        document.getElementById('customPopupOverlay').style.display = 'none';
    }

    document.addEventListener('input', function(e) {
        if (e.target && e.target.classList.contains('eqp-uppercase')) {
            const start = e.target.selectionStart;
            const end = e.target.selectionEnd;
            e.target.value = toUpperClean(e.target.value);
            if (typeof start === 'number' && typeof end === 'number') {
                e.target.setSelectionRange(start, end);
            }
        }
    });

    function openNewReceiverModal() {
        document.getElementById('newReceiverForm').reset();
        document.getElementById('newReceiverModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('recNameInput').focus();
        }, 50);
    }

    function closeNewReceiverModal() {
        document.getElementById('newReceiverModal').style.display = 'none';
    }

    async function saveNewReceiver(e) {
        e.preventDefault();
        const name = document.getElementById('recNameInput').value.trim();
        const designation = document.getElementById('recDesignationInput').value.trim();
        const phone = document.getElementById('recPhoneInput').value.trim();

        if (!name || !designation || !phone) {
            showCustomPopup("Validation Error", "Please enter Name, Designation, and Phone Number!", false);
            return;
        }

        const saveRecBtn = document.getElementById('saveReceiverBtn');
        saveRecBtn.disabled = true;
        saveRecBtn.textContent = "Saving...";

        try {
            const receiverPayload = {
                name: name,
                designation: designation,
                phone: phone,
                createdAt: new Date().toISOString()
            };

            await db.ref('receiver_list').push(receiverPayload);

            document.getElementById('entryReceiver').value = name;
            document.getElementById('entryReceiver').classList.remove('invalid');
            document.getElementById('receiverSuggestions').innerHTML = '';

            closeNewReceiverModal();
            showCustomPopup("Success", `New receiver "${name}" saved to receiver_list!`);
        } catch (err) {
            console.error("Error saving receiver:", err);
            showCustomPopup("Error", "Failed to save receiver: " + err.message, false);
        } finally {
            saveRecBtn.disabled = false;
            saveRecBtn.textContent = "Save Receiver";
        }
    }

    function openNewEquipmentModal() {
        document.getElementById('newEquipmentForm').reset();
        document.getElementById('newEquipmentModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('eqpCodeInput').focus();
        }, 50);
    }

    function closeNewEquipmentModal() {
        document.getElementById('newEquipmentModal').style.display = 'none';
    }

    async function saveNewEquipment(e) {
        e.preventDefault();
        const code = toUpperClean(document.getElementById('eqpCodeInput').value).trim();
        const name = toUpperClean(document.getElementById('eqpNameInput').value).trim();
        const model = toUpperClean(document.getElementById('eqpModelInput').value).trim();

        if (!code || !name || !model) {
            showCustomPopup("Validation Error", "Please enter Equipment Number, Name, and Model!", false);
            return;
        }

        const saveEqpBtn = document.getElementById('saveEquipmentBtn');
        saveEqpBtn.disabled = true;
        saveEqpBtn.textContent = "Saving...";

        try {
            const eqpPayload = {
                code: code,
                name: name,
                model: model,
                createdAt: new Date().toISOString()
            };

            await db.ref('equipment_list').push(eqpPayload);

            closeNewEquipmentModal();
            showCustomPopup("Success", `Equipment "${formatEquipmentLabel(eqpPayload)}" saved to equipment_list!`);
        } catch (err) {
            console.error("Error saving equipment:", err);
            showCustomPopup("Error", "Failed to save equipment: " + err.message, false);
        } finally {
            saveEqpBtn.disabled = false;
            saveEqpBtn.textContent = "Save Equipment";
        }
    }

    function listenToReceiverList() {
        db.ref('receiver_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(rec => {
                    if (rec && rec.name) {
                        const cleanName = rec.name.trim();
                        map.set(cleanName.toLowerCase(), {
                            name: cleanName,
                            designation: rec.designation ? rec.designation.trim() : "",
                            phone: rec.phone ? rec.phone.trim() : ""
                        });
                    }
                });
            }

            receiverDatabase = Array.from(map.values());
        });
    }

    function listenToEquipmentList() {
        db.ref('equipment_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(eq => {
                    if (eq && eq.code && eq.name) {
                        const cleanCode = toUpperClean(eq.code).trim();
                        const cleanName = toUpperClean(eq.name).trim();
                        const cleanModel = toUpperClean(eq.model).trim();
                        const key = `${cleanCode}|${cleanName}|${cleanModel}`;
                        map.set(key, {
                            code: cleanCode,
                            name: cleanName,
                            model: cleanModel
                        });
                    }
                });
            }

            equipmentDatabase = Array.from(map.values());
        });
    }

    function formatStockValue(val) {
        const num = parseFloat(val);
        if (isNaN(num)) return "0";
        return Number.isInteger(num) ? num.toString() : num.toFixed(2);
    }

    function fetchAvailableStock() {
        db.ref('stock_summary').once('value')
            .then((snapshot) => {
                const data = snapshot.val();
                productDatabase = [];
                if (data) {
                    Object.entries(data).forEach(([key, item]) => {
                        const stockVal = parseFloat(item.stock) || 0;
                        if (item && item.name && stockVal > 0) {
                            productDatabase.push({
                                firebaseKey: key,
                                name: item.name.toString().trim(),
                                unit: item.unit ? item.unit.toString().trim() : "Pcs",
                                stock: stockVal
                            });
                        }
                    });
                }
            })
            .catch((error) => {
                console.error("Error loading stock:", error);
            });
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchAvailableStock();
        listenToReceiverList();
        listenToEquipmentList();
    });

    async function generate5DigitIssueNo() {
        let nextNum = 1;
        try {
            const snap = await db.ref('stock_issue').limitToLast(1).once('value');
            if (snap.exists()) {
                const data = snap.val();
                const lastKey = Object.keys(data)[0];
                const lastIssueNo = data[lastKey].issueNo || '';
                const match = lastIssueNo.match(/\d+/);
                if (match) {
                    nextNum = parseInt(match[0], 10) + 1;
                }
            }
        } catch (e) {
            console.warn("Issue No fetch error, fallback sequence used:", e);
        }
        return 'ISS-' + String(nextNum).padStart(5, '0');
    }

            if (inp === receiverInput && hasSuggestions && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                const items = Array.from(receiverSuggestions.querySelectorAll('li'));
                let activeIndex = items.findIndex(item => item.classList.contains('active'));

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                    activeIndex = (activeIndex + 1) % items.length;
                    items[activeIndex].classList.add('active');
                    items[activeIndex].scrollIntoView({ block: 'nearest' });
                    return;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                    activeIndex = (activeIndex - 1 + items.length) % items.length;
                    items[activeIndex].classList.add('active');
                    items[activeIndex].scrollIntoView({ block: 'nearest' });
                    return;
                }
            }

            if (inp === receiverInput && hasSuggestions && e.key === 'Enter') {
                const activeItem = receiverSuggestions.querySelector('li.active');
                if (activeItem) {
                    e.preventDefault();
                    receiverInput.value = activeItem.getAttribute('data-name') || activeItem.textContent;

                    if (firstRowInput) firstRowInput.focus();

                }
            }

            if (inp === receiverInput && isArrowOrEnterKey(e.key)) {
                receiverSuggestions.innerHTML = '';
                clearIfUnlisted(receiverInput, "receiver");
            }

            if (e.key === 'ArrowRight' || e.key === 'Enter') {
                e.preventDefault();
                if (idx < headerInputs.length - 1) {
                    headerInputs[idx + 1].focus();
                    headerInputs[idx + 1].select();

                    const firstRowInput = tbody.querySelector('.item-input');
                    if (firstRowInput) firstRowInput.focus();

                e.preventDefault();

                    headerInputs[idx - 1].select();
                }
            }

    tbody.addEventListener('keydown', function(e) {
        const currentInput = e.target;
        if (currentInput.tagName !== 'INPUT') return;

        const cell = currentInput.closest('td');
        const currentRow = currentInput.closest('tr');
        const allRows = Array.from(tbody.querySelectorAll('tr'));
        const rowIndex = allRows.indexOf(currentRow);
        const rowInputs = Array.from(currentRow.querySelectorAll('input'));
        const colIndex = rowInputs.indexOf(currentInput);

        const suggestionsBox = cell ? cell.querySelector('.suggestions-box') : null;
        const hasSuggestions = suggestionsBox && suggestionsBox.children.length > 0;

        if (hasSuggestions && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
            const items = Array.from(suggestionsBox.querySelectorAll('li'));
            let activeIndex = items.findIndex(item => item.classList.contains('active'));

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                activeIndex = (activeIndex + 1) % items.length;
                items[activeIndex].classList.add('active');
                items[activeIndex].scrollIntoView({ block: 'nearest' });
                return;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                activeIndex = (activeIndex - 1 + items.length) % items.length;
                items[activeIndex].classList.add('active');
                items[activeIndex].scrollIntoView({ block: 'nearest' });
                return;
            }
        }

        if (hasSuggestions && e.key === 'Enter') {
            const activeItem = suggestionsBox.querySelector('li.active');
            if (activeItem) {
                e.preventDefault();
                const fullText = activeItem.querySelector('span') ? activeItem.querySelector('span').textContent : activeItem.textContent;

                if (currentInput.classList.contains('item-input')) {
                    const matchParts = fullText.match(/^(.*?)\s*\[(.*?)\]$/);
                    if (matchParts) {
                        const itemName = matchParts[1].trim();
                        const itemUnit = matchParts[2].trim();
                        currentInput.value = itemName;
                        currentRow.querySelector('.unit-input').value = itemUnit;

                        const foundItem = productDatabase.find(p =>
                            p.name.toLowerCase() === itemName.toLowerCase() &&
                            p.unit.toLowerCase() === itemUnit.toLowerCase()
                        );
                        if (foundItem) {
                            currentRow.querySelector('.qty-input').setAttribute('max', foundItem.stock);
                        }
                    }
                } else if (currentInput.classList.contains('eqp-input')) {
                    currentInput.value = toUpperClean(fullText);
                    currentInput.classList.remove('invalid');
                }

                suggestionsBox.innerHTML = '';
                focusNextInput(currentInput);
                return;
            }
        }

        // Clear unlisted Equipment value on Enter or Arrow keys
        if (currentInput.classList.contains('eqp-input') && isArrowOrEnterKey(e.key)) {
            if (suggestionsBox) suggestionsBox.innerHTML = '';
            clearIfUnlisted(currentInput, "equipment");
        }

        if (!hasSuggestions && e.key === 'ArrowDown') {
            e.preventDefault();
            if (rowIndex < allRows.length - 1) {
                const targetInput = allRows[rowIndex + 1].querySelectorAll('input')[colIndex];
                if (targetInput) { targetInput.focus(); targetInput.select(); }
            }
            return;
        }

        if (!hasSuggestions && e.key === 'ArrowUp') {
            e.preventDefault();
            if (rowIndex > 0) {
                const targetInput = allRows[rowIndex - 1].querySelectorAll('input')[colIndex];
                if (targetInput) { targetInput.focus(); targetInput.select(); }
            }
            return;
        }

        if (e.key === 'ArrowRight') {
            if (colIndex < rowInputs.length - 1) {
                e.preventDefault();
                let nextInp = rowInputs[colIndex + 1];
                if (nextInp.classList.contains('readonly-input')) {
                    nextInp = rowInputs[colIndex + 2];
                }
                if (nextInp) { nextInp.focus(); nextInp.select(); }
            }
            return;
        }

        if (e.key === 'ArrowLeft') {
            if (colIndex > 0) {
                e.preventDefault();
                let prevInp = rowInputs[colIndex - 1];
                if (prevInp.classList.contains('readonly-input')) {
                    prevInp = rowInputs[colIndex - 2];
                }
                if (prevInp) { prevInp.focus(); prevInp.select(); }
            } else if (rowIndex === 0) {
                document.getElementById('entryReceiver').focus();
            }
            return;
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            focusNextInput(currentInput);
        }
    });

    function focusNextInput(currentInput) {
        const currentRow = currentInput.closest('tr');
        const inputs = Array.from(currentRow.querySelectorAll('input'));
        const currentIndex = inputs.indexOf(currentInput);

        const itemVal = currentRow.querySelector('.item-input').value.trim();
        const qtyVal = currentRow.querySelector('.qty-input').value.trim();
        const unitVal = currentRow.querySelector('.unit-input').value.trim();
        const eqpVal = toUpperClean(currentRow.querySelector('.eqp-input').value).trim();
        const hrVal = currentRow.querySelector('.hr-input').value.trim();

        if (currentInput.classList.contains('qty-input')) {
            if (itemVal && qtyVal && unitVal && eqpVal && hrVal) {
                const nextRow = addNewRow();
                nextRow.querySelector('.item-input').focus();
                return;
            }
        }

        if (currentIndex === inputs.length - 1) {
            if (!itemVal || !qtyVal || !unitVal || !eqpVal || !hrVal) {
                showCustomPopup("Warning", "Please fill in Item, Quanty, Unit, Equipment, and Hr meter!", false);
                if (!itemVal) currentRow.querySelector('.item-input').classList.add('invalid');
                if (!qtyVal) currentRow.querySelector('.qty-input').classList.add('invalid');
                if (!eqpVal) currentRow.querySelector('.eqp-input').classList.add('invalid');
                if (!hrVal) currentRow.querySelector('.hr-input').classList.add('invalid');
                return;
            }

            const nextRow = addNewRow();
            nextRow.querySelector('.item-input').focus();
        } else {
            let nextIndex = currentIndex + 1;
            if (inputs[nextIndex] && inputs[nextIndex].classList.contains('readonly-input')) {
                nextIndex++;
            }
            if (inputs[nextIndex]) {
                inputs[nextIndex].focus();
                inputs[nextIndex].select();
            }
        }
    }

    document.getElementById('excelFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const sheetData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                if (!sheetData || sheetData.length === 0) {
                    showCustomPopup("Warning", "No data found in the Excel file!", false);
                    return;
                }

                const fileHeaders = sheetData[0].map(h => h ? h.toString().trim() : "");
                const requiredHeaders = ["Item", "Quanty", "Unit", "Equipment", "Hr meter", "Remarks"];
                const missingHeaders = requiredHeaders.filter(h => !fileHeaders.includes(h));

                if (missingHeaders.length > 0) {
                    showCustomPopup("Missing Columns", `Missing required columns: ${missingHeaders.join(", ")}`, false);
                    return;
                }

                const idxItem = fileHeaders.indexOf("Item");
                const idxQty = fileHeaders.indexOf("Quanty");
                const idxUnit = fileHeaders.indexOf("Unit");
                const idxEqp = fileHeaders.indexOf("Equipment");
                const idxHr = fileHeaders.indexOf("Hr meter");
                const idxErp = fileHeaders.indexOf("ERP Issue");
                const idxRem = fileHeaders.indexOf("Remarks");

                tbody.innerHTML = '';
                let addedCount = 0;

                for (let i = 1; i < sheetData.length; i++) {
                    const rowArr = sheetData[i];
                    if (!rowArr || rowArr.length === 0) continue;

                    const itemVal = rowArr[idxItem] ? rowArr[idxItem].toString().trim() : "";
                    const qtyVal = rowArr[idxQty] !== undefined && rowArr[idxQty] !== null ? rowArr[idxQty].toString().trim() : "";
                    const unitVal = rowArr[idxUnit] ? rowArr[idxUnit].toString().trim() : "";
                    const eqpVal = rowArr[idxEqp] ? toUpperClean(rowArr[idxEqp]).trim() : "";
                    const hrVal = rowArr[idxHr] ? rowArr[idxHr].toString().trim() : "";
                    const erpVal = idxErp >= 0 && rowArr[idxErp] ? rowArr[idxErp].toString().trim() : "";
                    const remVal = rowArr[idxRem] ? rowArr[idxRem].toString().trim() : "";

                    if (!itemVal && !qtyVal && !unitVal && !eqpVal) continue;

                    addNewRow({
                        item: itemVal,
                        qty: qtyVal,
                        unit: unitVal,
                        equipment: eqpVal,
                        hr: hrVal,
                        erp: erpVal,
                        remarks: remVal
                    });
                    addedCount++;
                }

                if (addedCount === 0) {
                    addNewRow();
                    showCustomPopup("Warning", "No valid item rows found in Excel!", false);
                } else {
                    showCustomPopup("Excel Loaded", `${addedCount} row(s) loaded successfully.`);
                }
            } catch (err) {
                console.error("Excel parse error:", err);
                showCustomPopup("Error", "Failed to read Excel file: " + err.message, false);
            } finally {
                e.target.value = '';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    document.getElementById('saveBtn').addEventListener('click', async function() {
        const entryDate = document.getElementById('entryDate').value.trim();
        const entryIndent = document.getElementById('entryIndent').value.trim();
        const rawReceiver = document.getElementById('entryReceiver').value;

        if (!entryDate || !rawReceiver.trim()) {
            showCustomPopup("Validation Error", "Please select Date and Receiver!", false);
            return;
        }

        const receiverCheck = validateAgainstDatabase(rawReceiver, "receiver");
        if (!receiverCheck.valid) {
            receiverInput.classList.add('invalid');
            showCustomPopup(
                "Invalid Receiver",
                `"${rawReceiver.trim()}" is not a valid entry in receiver_list. Please select a valid receiver or add via + New Receiver.`,
                false
            );
            return;
        }

        const entryReceiver = receiverCheck.value;
        const matchedReceiver = receiverCheck.record;

        const rows = Array.from(tbody.querySelectorAll('tr'));
        const issueItems = [];

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const itemInp = row.querySelector('.item-input');
            const qtyInp = row.querySelector('.qty-input');
            const unitInp = row.querySelector('.unit-input');
            const eqpInp = row.querySelector('.eqp-input');
            const hrInp = row.querySelector('.hr-input');
            const erpInp = row.querySelector('.erp-input');
            const remInp = row.querySelector('.rem-input');

            eqpInp.value = toUpperClean(eqpInp.value);

            const itemVal = itemInp.value.trim();
            const qtyVal = parseFloat(qtyInp.value);
            const unitVal = unitInp.value.trim();
            const eqpRaw = eqpInp.value;
            const hrVal = hrInp.value.trim();
            const erpVal = erpInp.value.trim();
            const remVal = remInp.value.trim();

            if (!itemVal && !qtyInp.value && !eqpRaw.trim() && !hrVal) continue;

            if (!itemVal || isNaN(qtyVal) || qtyVal <= 0 || !unitVal) {
                showCustomPopup("Validation Error", `Row ${i + 1}: Item, valid Quanty (> 0), and Unit are required!`, false);
                return;
            }

            const equipmentCheck = validateAgainstDatabase(eqpRaw, "equipment");
            if (!equipmentCheck.valid) {
                eqpInp.classList.add('invalid');
                showCustomPopup(
                    "Invalid Equipment",
                    `Row ${i + 1}: "${eqpRaw.trim()}" is not a valid entry in equipment_list. Please select a valid equipment or add via + New Equipment.`,
                    false
                );
                return;
            }

            const eqpVal = equipmentCheck.value;
            eqpInp.value = eqpVal;
            eqpInp.classList.remove('invalid');

            const matchedStock = productDatabase.find(p =>
                p.name.toLowerCase() === itemVal.toLowerCase() &&
                p.unit.toLowerCase() === unitVal.toLowerCase()
            );

            if (!matchedStock) {
                showCustomPopup("Stock Error", `Row ${i + 1}: "${itemVal}" [${unitVal}] is not available in stock_summary!`, false);
                return;
            }

            if (qtyVal > matchedStock.stock) {
                showCustomPopup("Insufficient Stock", `Row ${i + 1}: Requested ${qtyVal} ${unitVal}, but only ${formatStockValue(matchedStock.stock)} ${unitVal} available!`, false);
                return;
            }

            issueItems.push({
                firebaseKey: matchedStock.firebaseKey,
                item: itemVal,
                quantity: qtyVal,
                unit: unitVal,
                equipment: eqpVal,
                hrMeter: hrVal,
                erpIssue: erpVal,
                remarks: remVal
            });
        }

        if (issueItems.length === 0) {
            showCustomPopup("Warning", "Please enter at least one valid item to issue!", false);
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = "Submitting...";

        try {
            const issueNo = await generate5DigitIssueNo();

            for (const entry of issueItems) {
                const stockRef = db.ref(`stock_summary/${entry.firebaseKey}`);
                const txResult = await stockRef.transaction((currentData) => {
                    if (!currentData) return currentData;
                    const currentStock = parseFloat(currentData.stock) || 0;
                    if (currentStock < entry.quantity) {
                        return;
                    }
                    return {
                        ...currentData,
                        stock: currentStock - entry.quantity
                    };
                });

                if (!txResult.committed) {
                    throw new Error(`Insufficient stock for "${entry.item}" during transaction.`);
                }
            }

            const issuePayload = {
                issueNo: issueNo,
                date: entryDate,
                indent: entryIndent,
                receiver: entryReceiver,
                receiverDesignation: matchedReceiver ? matchedReceiver.designation : "",
                receiverPhone: matchedReceiver ? matchedReceiver.phone : "",
                createdAt: new Date().toISOString(),
                items: issueItems.map(({ firebaseKey, ...rest }) => rest)
            };

            await db.ref('stock_issue').push(issuePayload);

            if (analytics) {
                analytics.logEvent('stock_issue_submitted', {
                    issue_no: issueNo,
                    item_count: issueItems.length
                });
            }

            showCustomPopup("Success", "Stock issued and inventory updated successfully!", true, issueNo);

            document.getElementById('entryIndent').value = "";
            document.getElementById('entryReceiver').value = "";
            document.getElementById('entryReceiver').classList.remove('invalid');
            tbody.innerHTML = "";
            addNewRow();
            fetchAvailableStock();
        } catch (err) {
            console.error("Save error:", err);
            showCustomPopup("Error", "Failed to save stock issue: " + err.message, false);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Submit";
        }
    });
</script>
</body>
</html>
