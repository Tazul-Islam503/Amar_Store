<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Issue Module</title>

    <style>

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {

        }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        
        .header-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            width: 65%;
            min-width: 320px;
        }
        .header-group {
            position: relative;
        }
        .header-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .header-group input {
            width: 100%;
            padding: 8px;

            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;

        }
        .header-group input:focus { border-color: #007bff; outline: none; background-color: #eef5ff; }

        .receiver-input-wrap {
            display: flex;

            align-items: center;
        }
        .receiver-input-wrap input {
            flex: 1;
        }
        .new-receiver-btn {

            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;

        }

        .btn {

        .excel-upload-btn { background-color: #17a2b8; padding: 8px 14px; font-size: 13px; }

        .table-responsive {

        table {

            border-collapse: collapse;

        }
        th, td {

        th { background-color: #007bff; color: white; font-size: 14px; }
        
        .col-sl { width: 4%; }
        .col-item { width: 25%; }

        input {

            box-sizing: border-box;
            border: 1px solid #ccc;

        .suggestions-box {

        .suggestions-box li {

            border-bottom: 1px solid #eee;
            font-size: 13px;

        .stock-tag {

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

        .custom-popup-box {

            box-shadow: 0 8px 25px rgba(0,0,0,0.25);

            width: 90%;
            text-align: center;
            animation: popupScale 0.2s ease-in-out;
        }
        @keyframes popupScale {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-popup-box h3 { margin-top: 0; color: #28a745; font-size: 20px; }
        .custom-popup-box p { font-size: 14px; color: #555; margin: 12px 0 18px 0; white-space: pre-line; }
        .issue-no-badge {
            display: none;
            background: #f1f5f9;
            border: 2px dashed #28a745;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0 18px 0;
        }
        .issue-no-badge span.lbl {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .issue-no-badge span.val {
            font-size: 26px;
            font-weight: 800;
            color: #16a34a;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .custom-popup-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .custom-popup-btn:hover { background-color: #0056b3; }

        /* Form Modals (Receiver & Equipment) */
        .form-modal-box {
            background: #fff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 92%;
            text-align: left;
            animation: popupScale 0.2s ease-in-out;
        }
        .form-modal-box h3 {
            margin: 0 0 16px 0;
            color: #1e293b;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .modal-field {
            margin-bottom: 12px;
        }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        .modal-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .btn-cancel {
            background-color: #64748b;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-cancel:hover { background-color: #475569; }
        .btn-modal-save {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-modal-save:hover { background-color: #218838; }
        .btn-modal-save:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #back {
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            background-color: #2563eb;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }
        #back:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<!-- Custom Alert/Success Popup Modal -->
<div id="customPopupOverlay" class="modal-overlay">
    <div class="custom-popup-box">
        <h3 id="popupTitle">Success</h3>
        <p id="popupMessage"></p>
        <div id="issueNoBadge" class="issue-no-badge">
            <span class="lbl">Issue Posting No</span>
            <span id="popupIssueNo" class="val">ISS-2600001</span>
        </div>
        <button type="button" class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
    </div>
</div>

<!-- New Receiver Modal -->
<div id="newReceiverModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Receiver</h3>
        <form id="newReceiverForm" onsubmit="saveNewReceiver(event)">
            <div class="modal-field">
                <label for="recNameInput">Name <span style="color: red;">*</span></label>
                <input type="text" id="recNameInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recDesignationInput">Designation <span style="color: red;">*</span></label>
                <input type="text" id="recDesignationInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recPhoneInput">Phone Number <span style="color: red;">*</span></label>
                <input type="tel" id="recPhoneInput" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewReceiverModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveReceiverBtn">Save Receiver</button>
            </div>
        </form>
    </div>
</div>

<!-- New Equipment Modal -->
<div id="newEquipmentModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Equipment</h3>
        <form id="newEquipmentForm" onsubmit="saveNewEquipment(event)">
            <div class="modal-field">
                <label for="eqpCodeInput">Equipment Number <span style="color: red;">*</span></label>
                <input type="text" id="eqpCodeInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="eqpNameInput">Equipment Name <span style="color: red;">*</span></label>
                <input type="text" id="eqpNameInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="eqpModelInput">Model <span style="color: red;">*</span></label>
                <input type="text" id="eqpModelInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewEquipmentModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveEquipmentBtn">Save Equipment</button>
            </div>
        </form>
    </div>
</div>

    <!-- Header Information -->

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCQV_4nv_ohzevtZRxLj3Aq4kVafVEiLKw",
        authDomain: "tazul503.firebaseapp.com",
        databaseURL: "https://tazul503-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tazul503",
        storageBucket: "tazul503.firebasestorage.app",
        messagingSenderId: "190926921011",
        appId: "1:190926921011:web:77822854066e6a840f3246",
        measurementId: "G-GNHSXE22TQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let analytics = null;
    try {
        analytics = firebase.analytics();
    } catch (e) {
        console.warn("Analytics not available in this environment:", e);
    }

    let productDatabase = [];
    let receiverDatabase = [];
    let equipmentDatabase = [];

    const tbody = document.querySelector('#inventoryTable tbody');
    document.getElementById('entryDate').valueAsDate = new Date();

    function toUpperClean(val) {
        return val ? val.toString().toUpperCase() : "";
    }

    function formatEquipmentLabel(eq) {
        const code = toUpperClean(eq.code).trim();
        const name = toUpperClean(eq.name).trim();
        const model = toUpperClean(eq.model).trim();
        const parts = [name];
        if (model) parts.push(model);
        return `${code} (${parts.join(' - ')})`;
    }

    function validateAgainstDatabase(rawValue, type) {
        const cleaned = (rawValue || "").trim();
        if (!cleaned) {
            return { valid: false, value: "", record: null };
        }

        if (type === "receiver") {
            const matched = receiverDatabase.find(
                r => r.name.trim().toLowerCase() === cleaned.toLowerCase()
            );
            if (matched) {
                return { valid: true, value: matched.name.trim(), record: matched };
            }
            return { valid: false, value: cleaned, record: null };
        }

        if (type === "equipment") {
            const upperCleaned = toUpperClean(cleaned).trim();
            const matched = equipmentDatabase.find(eq => {
                const fullLabel = formatEquipmentLabel(eq).trim();
                const codeOnly = toUpperClean(eq.code).trim();
                return fullLabel === upperCleaned || codeOnly === upperCleaned;
            });
            if (matched) {
                return { valid: true, value: formatEquipmentLabel(matched), record: matched };
            }
            return { valid: false, value: upperCleaned, record: null };
        }

        return { valid: false, value: cleaned, record: null };
    }

    function clearIfUnlisted(inputEl, type) {
        if (!inputEl) return false;
        const currentVal = inputEl.value.trim();
        if (!currentVal) {
            inputEl.classList.remove('invalid');
            return false;
        }
        const check = validateAgainstDatabase(currentVal, type);
        if (!check.valid) {
            inputEl.value = "";
            inputEl.classList.remove('invalid');
            return true;
        }
        inputEl.value = check.value;
        inputEl.classList.remove('invalid');
        return false;
    }

    function showCustomPopup(title, message, isSuccess = true, issueNo = "") {
        document.getElementById('popupTitle').textContent = title;
        document.getElementById('popupTitle').style.color = isSuccess ? '#28a745' : '#dc3545';
        document.getElementById('popupMessage').textContent = message;

        const badge = document.getElementById('issueNoBadge');
        if (issueNo) {
            document.getElementById('popupIssueNo').textContent = issueNo;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }

        document.getElementById('customPopupOverlay').style.display = 'flex';
    }

    function closeCustomPopup() {
        document.getElementById('customPopupOverlay').style.display = 'none';
    }

    document.addEventListener('input', function(e) {
        if (e.target && e.target.classList.contains('eqp-uppercase')) {
            const start = e.target.selectionStart;
            const end = e.target.selectionEnd;
            e.target.value = toUpperClean(e.target.value);
            if (typeof start === 'number' && typeof end === 'number') {
                e.target.setSelectionRange(start, end);
            }
        }
    });

    function openNewReceiverModal() {
        document.getElementById('newReceiverForm').reset();
        document.getElementById('newReceiverModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('recNameInput').focus();
        }, 50);
    }

    function closeNewReceiverModal() {
        document.getElementById('newReceiverModal').style.display = 'none';
    }

    async function saveNewReceiver(e) {
        e.preventDefault();
        const name = document.getElementById('recNameInput').value.trim();
        const designation = document.getElementById('recDesignationInput').value.trim();
        const phone = document.getElementById('recPhoneInput').value.trim();

        if (!name || !designation || !phone) {
            showCustomPopup("Validation Error", "Please enter Name, Designation, and Phone Number!", false);
            return;
        }

        const saveRecBtn = document.getElementById('saveReceiverBtn');
        saveRecBtn.disabled = true;
        saveRecBtn.textContent = "Saving...";

        try {
            const receiverPayload = {
                name: name,
                designation: designation,
                phone: phone,
                createdAt: new Date().toISOString()
            };

            await db.ref('receiver_list').push(receiverPayload);

            document.getElementById('entryReceiver').value = name;
            document.getElementById('entryReceiver').classList.remove('invalid');
            document.getElementById('receiverSuggestions').innerHTML = '';

            closeNewReceiverModal();
            showCustomPopup("Success", `New receiver "${name}" saved to receiver_list!`);
        } catch (err) {
            console.error("Error saving receiver:", err);
            showCustomPopup("Error", "Failed to save receiver: " + err.message, false);
        } finally {
            saveRecBtn.disabled = false;
            saveRecBtn.textContent = "Save Receiver";
        }
    }

    function openNewEquipmentModal() {
        document.getElementById('newEquipmentForm').reset();
        document.getElementById('newEquipmentModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('eqpCodeInput').focus();
        }, 50);
    }

    function closeNewEquipmentModal() {
        document.getElementById('newEquipmentModal').style.display = 'none';
    }

    async function saveNewEquipment(e) {
        e.preventDefault();
        const code = toUpperClean(document.getElementById('eqpCodeInput').value).trim();
        const name = toUpperClean(document.getElementById('eqpNameInput').value).trim();
        const model = toUpperClean(document.getElementById('eqpModelInput').value).trim();

        if (!code || !name || !model) {
            showCustomPopup("Validation Error", "Please enter Equipment Number, Name, and Model!", false);
            return;
        }

        const saveEqpBtn = document.getElementById('saveEquipmentBtn');
        saveEqpBtn.disabled = true;
        saveEqpBtn.textContent = "Saving...";

        try {
            const eqpPayload = {
                code: code,
                name: name,
                model: model,
                createdAt: new Date().toISOString()
            };

            await db.ref('equipment_list').push(eqpPayload);

            closeNewEquipmentModal();
            showCustomPopup("Success", `Equipment "${formatEquipmentLabel(eqpPayload)}" saved to equipment_list!`);
        } catch (err) {
            console.error("Error saving equipment:", err);
            showCustomPopup("Error", "Failed to save equipment: " + err.message, false);
        } finally {
            saveEqpBtn.disabled = false;
            saveEqpBtn.textContent = "Save Equipment";
        }
    }

    function listenToReceiverList() {
        db.ref('receiver_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(rec => {
                    if (rec && rec.name) {
                        const cleanName = rec.name.trim();
                        map.set(cleanName.toLowerCase(), {
                            name: cleanName,
                            designation: rec.designation ? rec.designation.trim() : "",
                            phone: rec.phone ? rec.phone.trim() : ""
                        });
                    }
                });
            }

            receiverDatabase = Array.from(map.values());
        });
    }

    function listenToEquipmentList() {
        db.ref('equipment_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(eq => {
                    if (eq && eq.code && eq.name) {
                        const cleanCode = toUpperClean(eq.code).trim();
                        const cleanName = toUpperClean(eq.name).trim();
                        const cleanModel = toUpperClean(eq.model).trim();
                        const key = `${cleanCode}|${cleanName}|${cleanModel}`;
                        map.set(key, {
                            code: cleanCode,
                            name: cleanName,
                            model: cleanModel
                        });
                    }
                });
            }

            equipmentDatabase = Array.from(map.values());
        });
    }

    function formatStockValue(val) {
        const num = parseFloat(val);
        if (isNaN(num)) return "0";
        return Number.isInteger(num) ? num.toString() : num.toFixed(2);
    }

    function fetchAvailableStock() {
        return db.ref('stock_summary').once('value')
            .then((snapshot) => {
                const data = snapshot.val();
                productDatabase = [];
                if (data) {
                    Object.entries(data).forEach(([key, item]) => {
                        const stockVal = parseFloat(item.stock) || 0;
                        if (item && item.name && stockVal > 0) {
                            productDatabase.push({
                                firebaseKey: key,
                                name: item.name.toString().trim(),
                                unit: item.unit ? item.unit.toString().trim() : "Pcs",
                                stock: stockVal
                            });
                        }
                    });
                }
            })
            .catch((error) => {
                console.error("Error loading stock:", error);
            });
    }

    async function generateDynamicYearlyIssueNo() {
        const now = new Date();
        const yearTwoDigit = String(now.getFullYear()).slice(-2);
        const prefix = `ISS-${yearTwoDigit}`;
        const exactPattern = new RegExp(`^ISS-${yearTwoDigit}(\\d{6})$`);

        let maxSeqForYear = 0;

        try {
            const snap = await db.ref('stock_issue').once('value');
            if (snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(key => {
                    const rec = data[key];
                    const candidates = [key, rec?.firebaseId, rec?.issueNo];
                    candidates.forEach(val => {
                        if (typeof val === 'string') {
                            const match = val.trim().match(exactPattern);
                            if (match) {
                                const seqNum = parseInt(match[1], 10);
                                if (!isNaN(seqNum) && seqNum > maxSeqForYear) {
                                    maxSeqForYear = seqNum;
                                }
                            }
                        }
                    });
                });
            }
        } catch (e) {
            console.warn("Yearly Issue No fetch error, fallback sequence used:", e);
        }

        const nextSeq = maxSeqForYear + 1;
        const sixDigitSeq = String(nextSeq).padStart(6, '0');
        return `${prefix}${sixDigitSeq}`;
    }

    function buildFlatIssuePayload(issueNumber, items) {
        const flatPayload = {
            firebaseId: issueNumber,
            issueNo: issueNumber,
            date: document.getElementById('entryDate').value.trim(),
            indent: document.getElementById('entryIndent').value.trim(),
            receiver: document.getElementById('entryReceiver').value.trim(),
            createdAt: new Date().toISOString()
        };

        items.forEach((item, idx) => {
            const n = idx + 1;
            flatPayload[`itemName_${n}`] = item.itemName;
            flatPayload[`quantity_${n}`] = item.quantity;
            flatPayload[`unit_${n}`] = item.unit;
            flatPayload[`equipment_${n}`] = item.equipment;
            flatPayload[`hrMeter_${n}`] = item.hrMeter;
            flatPayload[`erpIssue_${n}`] = item.erpIssue;
            flatPayload[`remarks_${n}`] = item.remarks;
        });

        return flatPayload;
    }

    const receiverSuggestions = document.getElementById('receiverSuggestions');

    function renderReceiverSuggestions(query = "") {
        const q = query.trim().toLowerCase();
        const matches = receiverDatabase.filter(r =>
            !q ||
            r.name.toLowerCase().includes(q) ||
            (r.designation && r.designation.toLowerCase().includes(q)) ||
            (r.phone && r.phone.toLowerCase().includes(q))
        );

        receiverSuggestions.innerHTML = '';

            if (idx === 0) li.classList.add('active');
            li.setAttribute('data-name', rec.name);

            const leftSpan = document.createElement('span');
            leftSpan.textContent = rec.name;

            const rightSpan = document.createElement('span');
            rightSpan.className = 'receiver-meta';
            const metaParts = [rec.designation, rec.phone].filter(Boolean);
            rightSpan.textContent = metaParts.join(' • ');

            li.appendChild(leftSpan);
            li.appendChild(rightSpan);

            li.addEventListener('mousedown', function(e) {

                receiverInput.value = rec.name;
                receiverInput.classList.remove('invalid');

    receiverInput.addEventListener('focus', () => renderReceiverSuggestions(receiverInput.value));
    receiverInput.addEventListener('blur', () => {
        setTimeout(() => {
            receiverSuggestions.innerHTML = '';
            clearIfUnlisted(receiverInput, 'receiver');
        }, 150);
    });

    headerInputs.forEach((inp, idx) => {
        inp.addEventListener('keydown', function(e) {
            const hasSuggestions = receiverSuggestions.children.length > 0;

            if (inp === receiverInput && hasSuggestions && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                e.preventDefault();
                const items = Array.from(receiverSuggestions.querySelectorAll('li'));
                let activeIndex = items.findIndex(item => item.classList.contains('active'));
                if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                if (e.key === 'ArrowDown') {
                    activeIndex = (activeIndex + 1) % items.length;
                } else {
                    activeIndex = (activeIndex - 1 + items.length) % items.length;
                }
                items[activeIndex].classList.add('active');
                items[activeIndex].scrollIntoView({ block: 'nearest' });
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                if (inp === receiverInput && hasSuggestions) {
                    const activeItem = receiverSuggestions.querySelector('li.active');
                    if (activeItem) {
                        receiverInput.value = activeItem.getAttribute('data-name') || activeItem.textContent;
                        receiverInput.classList.remove('invalid');
                        receiverSuggestions.innerHTML = '';
                        const firstRowInput = tbody.querySelector('.item-input');
                        if (firstRowInput) firstRowInput.focus();
                        return;
                    }
                }

                if (inp === receiverInput) {
                    clearIfUnlisted(receiverInput, 'receiver');
                }

                if (idx < headerInputs.length - 1) {
                    headerInputs[idx + 1].focus();
                } else {
                    const firstRowInput = tbody.querySelector('.item-input');
                    if (firstRowInput) firstRowInput.focus();
                }
            } else if (e.key === 'ArrowDown' && !hasSuggestions) {
                e.preventDefault();
                if (idx < headerInputs.length - 1) {
                    headerInputs[idx + 1].focus();
                } else {
                    const firstRowInput = tbody.querySelector('.item-input');
                    if (firstRowInput) firstRowInput.focus();
                }

    // Unit-এর পরের কলামগুলোর (Equipment, Hr meter, ERP Issue, Remarks) ডাটা সংগ্রহ
    function getAfterUnitData(tr) {
        return {
            equipment: (tr.querySelector('.eqp-input')?.value || '').trim(),
            hrMeter: (tr.querySelector('.hr-input')?.value || '').trim(),
            erpIssue: (tr.querySelector('.erp-input')?.value || '').trim(),

    function hasAnyDataAfterUnit(tr) {

        return Boolean(d.equipment || d.hrMeter || d.erpIssue || d.remarks);
    }

        tr.innerHTML = `

            <td style="position: relative;">
                <input type="text" class="item-input" autocomplete="off" value="${itemData && itemData.itemName ? itemData.itemName : ''}">
                <ul class="suggestions-box"></ul>
            </td>
            <td>
                <input type="number" class="qty-input" step="any" min="0.01" value="${itemData && itemData.quantity !== undefined ? itemData.quantity : ''}">
            </td>
            <td>
                <input type="text" class="unit-input readonly-input" readonly tabindex="-1" value="${itemData && itemData.unit ? itemData.unit : ''}">
            </td>
            <td style="position: relative;">
                <input type="text" class="eqp-input eqp-uppercase" autocomplete="off" value="${itemData && itemData.equipment ? itemData.equipment : ''}">
                <ul class="suggestions-box"></ul>
            </td>
            <td>
                <input type="text" class="hr-input" value="${itemData && itemData.hrMeter ? itemData.hrMeter : ''}">
            </td>
            <td>
                <input type="text" class="erp-input" value="${itemData && itemData.erpIssue ? itemData.erpIssue : ''}">
            </td>
            <td>
                <input type="text" class="rem-input" value="${itemData && itemData.remarks ? itemData.remarks : ''}">
            </td>
            <td>
                <button type="button" class="delete-btn" onclick="deleteRow(this)">X</button>
            </td>
        `;

        if (typeof insertAtIndex === 'number' && insertAtIndex >= 0 && insertAtIndex < tbody.rows.length) {
            tbody.insertBefore(tr, tbody.rows[insertAtIndex]);
        } else {
            tbody.appendChild(tr);
        }

        attachRowEvents(tr);
        updateRowNumbers();
        return tr;
    }

    function deleteRow(btn) {
        const tr = btn.closest('tr');
        if (tbody.rows.length > 1) {
            tr.remove();
            updateRowNumbers();
        } else {
            tr.querySelectorAll('input').forEach(inp => {
                inp.value = '';
                inp.classList.remove('invalid');
            });
        }
    }

    function updateRowNumbers() {
        Array.from(tbody.rows).forEach((row, index) => {
            row.querySelector('.sl-cell').textContent = index + 1;
        });
    }

    function attachRowEvents(tr) {
        const itemInput = tr.querySelector('.item-input');
        const qtyInput = tr.querySelector('.qty-input');
        const unitInput = tr.querySelector('.unit-input');
        const eqpInput = tr.querySelector('.eqp-input');
        const hrInput = tr.querySelector('.hr-input');
        const erpInput = tr.querySelector('.erp-input');
        const remInput = tr.querySelector('.rem-input');

        const itemSuggestions = itemInput.nextElementSibling;
        const eqpSuggestions = eqpInput.nextElementSibling;

        // Unit-এর পরের কলামগুলোতে কোনো ডাটা থাকলে (১ম রো বাদে) নতুন রো ইনসার্ট ও কপি করার হেল্পার
        function insertNextRowWithAfterUnitData() {
            const rows = Array.from(tbody.rows);
            const rIdx = rows.indexOf(tr);
            const copiedData = getAfterUnitData(tr);
            const insertedRow = addNewRow(copiedData, rIdx + 1);
            insertedRow.querySelector('.item-input').focus();
        }

        function renderItemSuggestions() {
            const val = itemInput.value.trim().toLowerCase();
            itemSuggestions.innerHTML = '';

            const matches = productDatabase.filter(p =>
                !val || p.name.toLowerCase().includes(val)
            );

            matches.slice(0, 20).forEach((prod, idx) => {
                const li = document.createElement('li');
                if (idx === 0) li.classList.add('active');
                li.setAttribute('data-name', prod.name);
                li.setAttribute('data-unit', prod.unit);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = prod.name;

                const tagSpan = document.createElement('span');
                tagSpan.className = 'stock-tag';
                tagSpan.textContent = `Stock: ${formatStockValue(prod.stock)} ${prod.unit}`;

                li.appendChild(nameSpan);
                li.appendChild(tagSpan);

                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    itemInput.value = prod.name;
                    unitInput.value = prod.unit;
                    itemInput.classList.remove('invalid');
                    itemSuggestions.innerHTML = '';
                    qtyInput.focus();
                });

                itemSuggestions.appendChild(li);
            });
        }

        function renderEquipmentSuggestions() {
            const val = toUpperClean(eqpInput.value).trim().toLowerCase();
            eqpSuggestions.innerHTML = '';

            const matches = equipmentDatabase.filter(eq => {
                const label = formatEquipmentLabel(eq).toLowerCase();
                return !val || label.includes(val);
            });

            matches.slice(0, 20).forEach((eq, idx) => {
                const label = formatEquipmentLabel(eq);
                const li = document.createElement('li');
                if (idx === 0) li.classList.add('active');
                li.setAttribute('data-label', label);

                const leftSpan = document.createElement('span');
                leftSpan.textContent = label;

                li.appendChild(leftSpan);

                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    eqpInput.value = label;
                    eqpInput.classList.remove('invalid');
                    eqpSuggestions.innerHTML = '';
                    // ১ম রো না হলে এবং Unit-এর পরে ডাটা থাকলে নতুন রো ইনসার্ট হবে, নাহলে Hr meter-এ যাবে
                    if (!isFirstRow(tr) && hasAnyDataAfterUnit(tr)) {
                        insertNextRowWithAfterUnitData();
                    } else {
                        hrInput.focus();
                    }
                });

                eqpSuggestions.appendChild(li);
            });

        itemInput.addEventListener('input', renderItemSuggestions);

            setTimeout(() => {
                itemSuggestions.innerHTML = '';

                if (matched) {
                    itemInput.value = matched.name;
                    unitInput.value = matched.unit;
                    itemInput.classList.remove('invalid');
                } else if (itemInput.value.trim() !== '') {
                    unitInput.value = '';
                }
            }, 150);
        });

        eqpInput.addEventListener('input', renderEquipmentSuggestions);
        eqpInput.addEventListener('focus', renderEquipmentSuggestions);
        eqpInput.addEventListener('blur', () => {
            setTimeout(() => {
                eqpSuggestions.innerHTML = '';
                clearIfUnlisted(eqpInput, 'equipment');
            }, 150);
        });

        const navigableInputs = [itemInput, qtyInput, eqpInput, hrInput, erpInput, remInput];

        navigableInputs.forEach((inp, cIdx) => {
            inp.addEventListener('keydown', function(e) {
                const activeBox = (inp === itemInput) ? itemSuggestions :
                                  (inp === eqpInput) ? eqpSuggestions : null;
                const hasSug = activeBox && activeBox.children.length > 0;

                if (hasSug && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                    e.preventDefault();
                    const items = Array.from(activeBox.querySelectorAll('li'));
                    let activeIndex = items.findIndex(item => item.classList.contains('active'));
                    if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                    if (e.key === 'ArrowDown') {
                        activeIndex = (activeIndex + 1) % items.length;
                    } else {
                        activeIndex = (activeIndex - 1 + items.length) % items.length;
                    }
                    items[activeIndex].classList.add('active');
                    items[activeIndex].scrollIntoView({ block: 'nearest' });
                    return;
                }

                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (hasSug) {
                        const activeItem = activeBox.querySelector('li.active');
                        if (activeItem) {
                            if (inp === itemInput) {
                                const pName = activeItem.getAttribute('data-name');
                                const pUnit = activeItem.getAttribute('data-unit');
                                itemInput.value = pName;
                                unitInput.value = pUnit;
                                itemInput.classList.remove('invalid');
                                itemSuggestions.innerHTML = '';
                                qtyInput.focus();
                                return;
                            } else if (inp === eqpInput) {
                                eqpInput.value = activeItem.getAttribute('data-label');
                                eqpInput.classList.remove('invalid');
                                eqpSuggestions.innerHTML = '';
                                if (!isFirstRow(tr) && hasAnyDataAfterUnit(tr)) {
                                    insertNextRowWithAfterUnitData();
                                } else {
                                    hrInput.focus();
                                }
                                return;
                            }
                        }
                    }

                    if (inp === eqpInput) {
                        clearIfUnlisted(eqpInput, 'equipment');
                    }

                    // ১ম রো পুরোটা ফোকাস করবে।
                    // ১ম রো-এর পরের রো-গুলোতে: Unit-এর পরে (eqp, hr, erp, rem) ডাটা থাকলে ফোকাস না করে নতুন রো ইনসার্ট করবে;
                    // Unit-এর পরে blank থাকলে স্বাভাবিক নিয়মে ফোকাস করবে।
                    const isAfterUnitField = (inp === eqpInput || inp === hrInput || inp === erpInput || inp === remInput);
                    if (!isFirstRow(tr) && isAfterUnitField && hasAnyDataAfterUnit(tr)) {
                        insertNextRowWithAfterUnitData();
                        return;
                    }

                    if (cIdx < navigableInputs.length - 1) {
                        navigableInputs[cIdx + 1].focus();
                    } else {
                        if (itemInput.value.trim() !== '') {
                            const rows = Array.from(tbody.rows);
                            const rIdx = rows.indexOf(tr);
                            const copiedData = getAfterUnitData(tr);
                            if (rIdx === rows.length - 1) {
                                const nextTr = addNewRow(copiedData);
                                nextTr.querySelector('.item-input').focus();
                            } else {
                                rows[rIdx + 1].querySelector('.item-input').focus();
                            }
                        } else {
                            showCustomPopup("Missing Item", "Please select an Item before moving to a new row!", false);
                        }
                    }
                } else if (e.key === 'ArrowRight' && !hasSug) {
                    if (cIdx < navigableInputs.length - 1) {
                        e.preventDefault();
                        navigableInputs[cIdx + 1].focus();
                    }
                } else if (e.key === 'ArrowLeft' && !hasSug) {
                    if (cIdx > 0) {
                        e.preventDefault();
                        navigableInputs[cIdx - 1].focus();
                    }
                } else if (e.key === 'ArrowDown' && !hasSug) {
                    e.preventDefault();
                    const rows = Array.from(tbody.rows);
                    const rIdx = rows.indexOf(tr);
                    if (rIdx < rows.length - 1) {
                        const targetRowInputs = [
                            rows[rIdx + 1].querySelector('.item-input'),
                            rows[rIdx + 1].querySelector('.qty-input'),
                            rows[rIdx + 1].querySelector('.eqp-input'),
                            rows[rIdx + 1].querySelector('.hr-input'),
                            rows[rIdx + 1].querySelector('.erp-input'),
                            rows[rIdx + 1].querySelector('.rem-input')
                        ];
                        if (targetRowInputs[cIdx]) targetRowInputs[cIdx].focus();
                    }
                } else if (e.key === 'ArrowUp' && !hasSug) {
                    e.preventDefault();
                    const rows = Array.from(tbody.rows);
                    const rIdx = rows.indexOf(tr);
                    if (rIdx > 0) {
                        const targetRowInputs = [
                            rows[rIdx - 1].querySelector('.item-input'),
                            rows[rIdx - 1].querySelector('.qty-input'),
                            rows[rIdx - 1].querySelector('.eqp-input'),
                            rows[rIdx - 1].querySelector('.hr-input'),
                            rows[rIdx - 1].querySelector('.erp-input'),
                            rows[rIdx - 1].querySelector('.rem-input')
                        ];
                        if (targetRowInputs[cIdx]) targetRowInputs[cIdx].focus();
                    } else {
                        headerInputs[headerInputs.length - 1].focus();
                    }
                }
            });
        });
    }

    document.getElementById('excelFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (!rows.length) {
                    showCustomPopup("Empty File", "The selected Excel/CSV file has no data rows.", false);
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(r => {
                    const itemName = (r.Item || r.item || r['Item Name'] || '').toString().trim();
                    const quantity = r.Quanty ?? r.Quantity ?? r.quanty ?? r.quantity ?? '';
                    const unit = (r.Unit || r.unit || '').toString().trim();
                    const eqpCheck = validateAgainstDatabase(r.Equipment || r.equipment || '', 'equipment');
                    const equipment = eqpCheck.valid ? eqpCheck.value : '';
                    const hrMeter = (r['Hr meter'] || r.HrMeter || r['Hr Meter'] || r.hrMeter || '').toString().trim();
                    const erpIssue = (r['ERP Issue'] || r.ErpIssue || r.erpIssue || '').toString().trim();
                    const remarks = (r.Remarks || r.remarks || '').toString().trim();

                    if (itemName || quantity !== '') {
                        addNewRow({
                            itemName,
                            quantity,
                            unit,
                            equipment,
                            hrMeter,
                            erpIssue,
                            remarks
                        });
                    }
                });

                if (tbody.rows.length === 0) {
                    addNewRow();
                }
                updateRowNumbers();
                showCustomPopup("Excel Loaded", `${tbody.rows.length} row(s) loaded from Excel.`);
            } catch (err) {
                console.error("Excel parse error:", err);
                showCustomPopup("Excel Error", "Failed to read Excel file: " + err.message, false);
            } finally {
                e.target.value = '';
            }
        };
        reader.readAsArrayBuffer(file);
    });

            const hrMeter = hrInp.value.trim();
            const erpIssue = erpInp.value.trim();
            const remarks = remInp.value.trim();

            itemInp.classList.remove('invalid');
            qtyInp.classList.remove('invalid');
            eqpInp.classList.remove('invalid');

            if (itemName || qtyInp.value.trim() || equipment || hrMeter || erpIssue || remarks) {
                const matchedStock = productDatabase.find(p => p.name.toLowerCase() === itemName.toLowerCase());
                if (!itemName || !matchedStock) {
                    hasError = true;
                    itemInp.classList.add('invalid');
                    errorMsg = `Row #${idx + 1}: Please select a valid Item from available stock.`;
                    return;
                }
                if (isNaN(qtyVal) || qtyVal <= 0) {
                    hasError = true;
                    qtyInp.classList.add('invalid');
                    errorMsg = `Row #${idx + 1}: Please enter a valid positive Quantity.`;
                    return;
                }
                if (qtyVal > matchedStock.stock) {
                    hasError = true;
                    qtyInp.classList.add('invalid');
                    errorMsg = `Row #${idx + 1}: Quantity (${qtyVal}) exceeds available stock (${formatStockValue(matchedStock.stock)} ${matchedStock.unit}) for "${matchedStock.name}".`;
                    return;
                }

                itemsToIssue.push({
                    firebaseKey: matchedStock.firebaseKey,
                    itemName: matchedStock.name,
                    quantity: qtyVal,
                    unit: unit || matchedStock.unit,
                    equipment: equipment,
                    hrMeter: hrMeter,
                    erpIssue: erpIssue,
                    remarks: remarks
                });
            }
        });

        if (hasError) {
            showCustomPopup("Validation Error", errorMsg, false);
            return;
        }

        if (itemsToIssue.length === 0) {
            showCustomPopup("Empty Table", "Please enter at least one valid item to issue!", false);
            return;
        }

        saveBtn.disabled = true;
        const originalText = saveBtn.textContent;
        saveBtn.textContent = "Submitting...";

        try {
            const issueNumber = await generateDynamicYearlyIssueNo();
            const flatPayload = buildFlatIssuePayload(issueNumber, itemsToIssue);

            await db.ref(`stock_issue/${issueNumber}`).set(flatPayload);

            for (const it of itemsToIssue) {
                const stockRef = db.ref(`stock_summary/${it.firebaseKey}`);
                await stockRef.transaction((currentData) => {
                    if (!currentData) return currentData;
                    const prevStock = parseFloat(currentData.stock) || 0;
                    return {
                        ...currentData,
                        stock: Math.max(0, prevStock - it.quantity)
                    };
                });
            }

            if (analytics) {
                analytics.logEvent('stock_issue_submitted', {
                    issue_no: issueNumber,
                    item_count: itemsToIssue.length
                });
            }

            resetIssueForm();
            showCustomPopup(
                "Issue Posted",
                `Stock issued successfully in flat format with ID: ${issueNumber}`,
                true,
                issueNumber
            );
        } catch (err) {
            console.error("Error submitting stock issue:", err);
            showCustomPopup("Submission Error", "Failed to post stock issue: " + err.message, false);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
        }
    });

    listenToReceiverList();
    listenToEquipmentList();
    fetchAvailableStock();
    addNewRow();
</script>

</body>
</html>
