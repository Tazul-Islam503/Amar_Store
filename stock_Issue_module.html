<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Issue Module</title>
    <!-- SheetJS CDN for Excel Upload -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase App, Database & Analytics SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow: visible !important;
        }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        
        .header-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            width: 65%;
            min-width: 320px;
        }
        .header-group {
            position: relative;
        }
        .header-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .header-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        .header-group input:focus { border-color: #007bff; outline: none; background-color: #eef5ff; }

        .receiver-input-wrap {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .receiver-input-wrap input {
            flex: 1;
        }
        .new-receiver-btn {
            background-color: #0d6efd;
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .new-receiver-btn:hover {
            background-color: #0b5ed7;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;

        }
        .eqp-add-btn { background-color: #6f42c1; padding: 8px 14px; font-size: 13px; }
        .eqp-add-btn:hover { background-color: #59339d; }
        .excel-upload-btn { background-color: #17a2b8; padding: 8px 14px; font-size: 13px; }
        .excel-upload-btn:hover { background-color: #138496; }
        .save-btn { background-color: #28a745; }
        .save-btn:hover { background-color: #218838; }
        .save-btn:disabled { background-color: #6c757d; cursor: not-allowed; }

        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            margin-bottom: 10px;

        }

        .table-footer-submit {

        }

        .table-responsive {
            width: 100%;
            overflow: visible !important;
            margin-bottom: 10px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 950px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
            position: relative; 
            overflow: visible !important;
        }
        th { background-color: #007bff; color: white; font-size: 14px; }
        
        .col-sl { width: 4%; }
        .col-item { width: 25%; }
        .col-qty { width: 9%; }
        .col-unit { width: 9%; }
        .col-eqp { width: 19%; }
        .col-hr { width: 9%; }

        .col-rem { width: 11%; }
        .col-act { width: 5%; }

        input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        input.eqp-uppercase {
            text-transform: uppercase;
        }
        input:focus { border-color: #007bff; outline: none; background-color: #eef5ff; }
        input.readonly-input { background-color: #e9ecef; cursor: not-allowed; font-weight: bold; }
        input.invalid { border-color: #dc3545; background-color: #fff8f8; }
        
        .suggestions-box {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%; 
            background: #fff;
            border: 1px solid #007bff;
            border-top: none;
            max-height: 300px; 
            overflow-y: auto;
            z-index: 999999;
            list-style: none;
            padding: 0;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
        }
        .suggestions-box li {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;

        .suggestions-box li.active, .suggestions-box li:hover {
            background-color: #007bff;

        }
        .stock-tag {
            font-size: 11px;

            color: #fff;

            white-space: nowrap;
        }
        .suggestions-box li.active .stock-tag,
        .suggestions-box li:hover .stock-tag {

        }
        .receiver-meta {
            font-size: 11px;

        }
        .suggestions-box li.active .receiver-meta,
        .suggestions-box li:hover .receiver-meta {

        }
        .delete-btn {

            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { background-color: #c82333; }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999999;
        }
        .custom-popup-box {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: popupScale 0.2s ease-in-out;
        }
        @keyframes popupScale {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-popup-box h3 { margin-top: 0; color: #28a745; font-size: 20px; }
        .custom-popup-box p { font-size: 14px; color: #555; margin: 12px 0 18px 0; white-space: pre-line; }
        .issue-no-badge {
            display: none;
            background: #f1f5f9;
            border: 2px dashed #28a745;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0 18px 0;
        }
        .issue-no-badge span.lbl {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .issue-no-badge span.val {
            font-size: 26px;
            font-weight: 800;
            color: #16a34a;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .custom-popup-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .custom-popup-btn:hover { background-color: #0056b3; }

        /* Form Modals (Receiver & Equipment) */
        .form-modal-box {
            background: #fff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 92%;
            text-align: left;
            animation: popupScale 0.2s ease-in-out;
        }
        .form-modal-box h3 {
            margin: 0 0 16px 0;
            color: #1e293b;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .modal-field {
            margin-bottom: 12px;
        }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        .modal-field input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .btn-cancel {
            background-color: #64748b;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-cancel:hover { background-color: #475569; }
        .btn-modal-save {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-modal-save:hover { background-color: #218838; }
        .btn-modal-save:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #back {
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            background-color: #2563eb;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }
        #back:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<!-- Custom Alert/Success Popup Modal -->
<div id="customPopupOverlay" class="modal-overlay">
    <div class="custom-popup-box">
        <h3 id="popupTitle">Success</h3>
        <p id="popupMessage">Message goes here...</p>
        <div id="issueNoBadge" class="issue-no-badge">
            <span class="lbl">Issue Posting No</span>
            <span id="popupIssueNo" class="val">ISS-00001</span>
        </div>
        <button type="button" class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
    </div>
</div>

<!-- New Receiver Modal -->
<div id="newReceiverModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Receiver</h3>
        <form id="newReceiverForm" onsubmit="saveNewReceiver(event)">
            <div class="modal-field">
                <label for="recNameInput">Name <span style="color: red;">*</span></label>
                <input type="text" id="recNameInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recDesignationInput">Designation <span style="color: red;">*</span></label>
                <input type="text" id="recDesignationInput" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="recPhoneInput">Phone Number <span style="color: red;">*</span></label>
                <input type="tel" id="recPhoneInput" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewReceiverModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveReceiverBtn">Save Receiver</button>
            </div>
        </form>
    </div>
</div>

<!-- New Equipment Modal -->
<div id="newEquipmentModal" class="modal-overlay">
    <div class="form-modal-box">
        <h3>Add New Equipment</h3>
        <form id="newEquipmentForm" onsubmit="saveNewEquipment(event)">
            <div class="modal-field">
                <label for="eqpCodeInput">Equipment Number <span style="color: red;">*</span></label>
                <input type="text" id="eqpCodeInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="eqpNameInput">Equipment Name <span style="color: red;">*</span></label>
                <input type="text" id="eqpNameInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-field">
                <label for="eqpModelInput">Model <span style="color: red;">*</span></label>
                <input type="text" id="eqpModelInput" class="eqp-uppercase" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeNewEquipmentModal()">Cancel</button>
                <button type="submit" class="btn-modal-save" id="saveEquipmentBtn">Save Equipment</button>
            </div>
        </form>
    </div>
</div>

<div class="container" id="mainContainer">

    <!-- Header Information -->
    <div class="header-section" id="headerSection">

    <!-- Back to home -->
    <a href="index.html" id="back">Back</a>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCQV_4nv_ohzevtZRxLj3Aq4kVafVEiLKw",
        authDomain: "tazul503.firebaseapp.com",
        databaseURL: "https://tazul503-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tazul503",
        storageBucket: "tazul503.firebasestorage.app",
        messagingSenderId: "190926921011",
        appId: "1:190926921011:web:77822854066e6a840f3246",
        measurementId: "G-GNHSXE22TQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let analytics = null;
    try {
        analytics = firebase.analytics();
    } catch (e) {
        console.warn("Analytics not available in this environment:", e);
    }

    let productDatabase = [];
    let receiverDatabase = [];
    let equipmentDatabase = [];

    const tbody = document.querySelector('#inventoryTable tbody');
    document.getElementById('entryDate').valueAsDate = new Date();

    function toUpperClean(val) {
        return val ? val.toString().toUpperCase() : "";
    }

    function formatEquipmentLabel(eq) {
        const code = toUpperClean(eq.code).trim();
        const name = toUpperClean(eq.name).trim();
        const model = toUpperClean(eq.model).trim();
        const parts = [name];
        if (model) parts.push(model);
        return `${code} (${parts.join(' - ')})`;
    }

    function validateAgainstDatabase(rawValue, type) {
        const cleaned = (rawValue || "").trim();
        if (!cleaned) {
            return { valid: false, value: "", record: null };
        }

        if (type === "receiver") {
            const matched = receiverDatabase.find(
                r => r.name.trim().toLowerCase() === cleaned.toLowerCase()
            );
            if (matched) {
                return { valid: true, value: matched.name.trim(), record: matched };
            }
            return { valid: false, value: cleaned, record: null };
        }

        if (type === "equipment") {
            const upperCleaned = toUpperClean(cleaned).trim();
            const matched = equipmentDatabase.find(eq => {
                const fullLabel = formatEquipmentLabel(eq).trim();
                const codeOnly = toUpperClean(eq.code).trim();
                return fullLabel === upperCleaned || codeOnly === upperCleaned;
            });
            if (matched) {
                return { valid: true, value: formatEquipmentLabel(matched), record: matched };
            }
            return { valid: false, value: upperCleaned, record: null };
        }

        return { valid: false, value: cleaned, record: null };
    }

    function clearIfUnlisted(inputEl, type) {
        if (!inputEl) return false;
        const currentVal = inputEl.value.trim();
        if (!currentVal) {
            inputEl.classList.remove('invalid');
            return false;
        }
        const check = validateAgainstDatabase(currentVal, type);
        if (!check.valid) {
            inputEl.value = "";
            inputEl.classList.remove('invalid');
            return true;
        }
        inputEl.value = check.value;
        inputEl.classList.remove('invalid');
        return false;
    }

    function showCustomPopup(title, message, isSuccess = true, issueNo = "") {
        document.getElementById('popupTitle').textContent = title;
        document.getElementById('popupTitle').style.color = isSuccess ? '#28a745' : '#dc3545';
        document.getElementById('popupMessage').textContent = message;

        const badge = document.getElementById('issueNoBadge');
        if (issueNo) {
            document.getElementById('popupIssueNo').textContent = issueNo;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }

        document.getElementById('customPopupOverlay').style.display = 'flex';
    }

    function closeCustomPopup() {
        document.getElementById('customPopupOverlay').style.display = 'none';
    }

    document.addEventListener('input', function(e) {
        if (e.target && e.target.classList.contains('eqp-uppercase')) {
            const start = e.target.selectionStart;
            const end = e.target.selectionEnd;
            e.target.value = toUpperClean(e.target.value);
            if (typeof start === 'number' && typeof end === 'number') {
                e.target.setSelectionRange(start, end);
            }
        }
    });

    function openNewReceiverModal() {
        document.getElementById('newReceiverForm').reset();
        document.getElementById('newReceiverModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('recNameInput').focus();
        }, 50);
    }

    function closeNewReceiverModal() {
        document.getElementById('newReceiverModal').style.display = 'none';
    }

    async function saveNewReceiver(e) {
        e.preventDefault();
        const name = document.getElementById('recNameInput').value.trim();
        const designation = document.getElementById('recDesignationInput').value.trim();
        const phone = document.getElementById('recPhoneInput').value.trim();

        if (!name || !designation || !phone) {
            showCustomPopup("Validation Error", "Please enter Name, Designation, and Phone Number!", false);
            return;
        }

        const saveRecBtn = document.getElementById('saveReceiverBtn');
        saveRecBtn.disabled = true;
        saveRecBtn.textContent = "Saving...";

        try {
            const receiverPayload = {
                name: name,
                designation: designation,
                phone: phone,
                createdAt: new Date().toISOString()
            };

            await db.ref('receiver_list').push(receiverPayload);

            document.getElementById('entryReceiver').value = name;
            document.getElementById('entryReceiver').classList.remove('invalid');
            document.getElementById('receiverSuggestions').innerHTML = '';

            closeNewReceiverModal();
            showCustomPopup("Success", `New receiver "${name}" saved to receiver_list!`);
        } catch (err) {
            console.error("Error saving receiver:", err);
            showCustomPopup("Error", "Failed to save receiver: " + err.message, false);
        } finally {
            saveRecBtn.disabled = false;
            saveRecBtn.textContent = "Save Receiver";
        }
    }

    function openNewEquipmentModal() {
        document.getElementById('newEquipmentForm').reset();
        document.getElementById('newEquipmentModal').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('eqpCodeInput').focus();
        }, 50);
    }

    function closeNewEquipmentModal() {
        document.getElementById('newEquipmentModal').style.display = 'none';
    }

    async function saveNewEquipment(e) {
        e.preventDefault();
        const code = toUpperClean(document.getElementById('eqpCodeInput').value).trim();
        const name = toUpperClean(document.getElementById('eqpNameInput').value).trim();
        const model = toUpperClean(document.getElementById('eqpModelInput').value).trim();

        if (!code || !name || !model) {
            showCustomPopup("Validation Error", "Please enter Equipment Number, Name, and Model!", false);
            return;
        }

        const saveEqpBtn = document.getElementById('saveEquipmentBtn');
        saveEqpBtn.disabled = true;
        saveEqpBtn.textContent = "Saving...";

        try {
            const eqpPayload = {
                code: code,
                name: name,
                model: model,
                createdAt: new Date().toISOString()
            };

            await db.ref('equipment_list').push(eqpPayload);

            closeNewEquipmentModal();
            showCustomPopup("Success", `Equipment "${formatEquipmentLabel(eqpPayload)}" saved to equipment_list!`);
        } catch (err) {
            console.error("Error saving equipment:", err);
            showCustomPopup("Error", "Failed to save equipment: " + err.message, false);
        } finally {
            saveEqpBtn.disabled = false;
            saveEqpBtn.textContent = "Save Equipment";
        }
    }

    function listenToReceiverList() {
        db.ref('receiver_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(rec => {
                    if (rec && rec.name) {
                        const cleanName = rec.name.trim();
                        map.set(cleanName.toLowerCase(), {
                            name: cleanName,
                            designation: rec.designation ? rec.designation.trim() : "",
                            phone: rec.phone ? rec.phone.trim() : ""
                        });
                    }
                });
            }

            receiverDatabase = Array.from(map.values());
        });
    }

    function listenToEquipmentList() {
        db.ref('equipment_list').on('value', (snapshot) => {
            const data = snapshot.val();
            const map = new Map();

            if (data) {
                Object.values(data).forEach(eq => {
                    if (eq && eq.code && eq.name) {
                        const cleanCode = toUpperClean(eq.code).trim();
                        const cleanName = toUpperClean(eq.name).trim();
                        const cleanModel = toUpperClean(eq.model).trim();
                        const key = `${cleanCode}|${cleanName}|${cleanModel}`;
                        map.set(key, {
                            code: cleanCode,
                            name: cleanName,
                            model: cleanModel
                        });
                    }
                });
            }

            equipmentDatabase = Array.from(map.values());
        });
    }

    function formatStockValue(val) {
        const num = parseFloat(val);
        if (isNaN(num)) return "0";
        return Number.isInteger(num) ? num.toString() : num.toFixed(2);
    }

    function fetchAvailableStock() {
        return db.ref('stock_summary').once('value')
            .then((snapshot) => {
                const data = snapshot.val();
                productDatabase = [];
                if (data) {
                    Object.entries(data).forEach(([key, item]) => {
                        const stockVal = parseFloat(item.stock) || 0;
                        if (item && item.name && stockVal > 0) {
                            productDatabase.push({
                                firebaseKey: key,
                                name: item.name.toString().trim(),
                                unit: item.unit ? item.unit.toString().trim() : "Pcs",
                                stock: stockVal
                            });
                        }
                    });
                }
            })
            .catch((error) => {
                console.error("Error loading stock:", error);
            });
    }

    async function generate5DigitIssueNo() {
        let nextNum = 1;
        try {
            const snap = await db.ref('stock_issue').limitToLast(1).once('value');
            if (snap.exists()) {
                const data = snap.val();
                const lastKey = Object.keys(data)[0];
                const lastIssueNo = data[lastKey].issueNo || '';
                const match = lastIssueNo.match(/\d+/);
                if (match) {
                    nextNum = parseInt(match[0], 10) + 1;
                }
            }
        } catch (e) {
            console.warn("Issue No fetch error, fallback sequence used:", e);
        }
        return 'ISS-' + String(nextNum).padStart(5, '0');
    }

    const headerInputs = Array.from(document.querySelectorAll('.header-input'));
    const receiverInput = document.getElementById('entryReceiver');
    const receiverSuggestions = document.getElementById('receiverSuggestions');

    function renderReceiverSuggestions(query = "") {
        const q = query.trim().toLowerCase();
        const matches = receiverDatabase.filter(r =>
            !q ||
            r.name.toLowerCase().includes(q) ||
            (r.designation && r.designation.toLowerCase().includes(q)) ||
            (r.phone && r.phone.toLowerCase().includes(q))
        );

        receiverSuggestions.innerHTML = '';
        if (!matches.length) return;

        matches.slice(0, 15).forEach((rec, idx) => {
            const li = document.createElement('li');
            if (idx === 0) li.classList.add('active');
            li.setAttribute('data-name', rec.name);

            const leftSpan = document.createElement('span');
            leftSpan.textContent = rec.name;

            const rightSpan = document.createElement('span');
            rightSpan.className = 'receiver-meta';
            const metaParts = [rec.designation, rec.phone].filter(Boolean);
            rightSpan.textContent = metaParts.join(' • ');

            li.appendChild(leftSpan);
            li.appendChild(rightSpan);

            li.addEventListener('mousedown', function(e) {
                e.preventDefault();
                receiverInput.value = rec.name;
                receiverInput.classList.remove('invalid');
                receiverSuggestions.innerHTML = '';
                const firstRowInput = tbody.querySelector('.item-input');
                if (firstRowInput) firstRowInput.focus();
            });

            receiverSuggestions.appendChild(li);
        });
    }

    receiverInput.addEventListener('input', () => renderReceiverSuggestions(receiverInput.value));
    receiverInput.addEventListener('focus', () => renderReceiverSuggestions(receiverInput.value));
    receiverInput.addEventListener('blur', () => {
        setTimeout(() => {
            receiverSuggestions.innerHTML = '';
            clearIfUnlisted(receiverInput, 'receiver');
        }, 150);
    });

    headerInputs.forEach((inp, idx) => {
        inp.addEventListener('keydown', function(e) {
            const hasSuggestions = receiverSuggestions.children.length > 0;

            if (inp === receiverInput && hasSuggestions && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                const items = Array.from(receiverSuggestions.querySelectorAll('li'));
                let activeIndex = items.findIndex(item => item.classList.contains('active'));

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                    activeIndex = (activeIndex + 1) % items.length;
                    items[activeIndex].classList.add('active');
                    items[activeIndex].scrollIntoView({ block: 'nearest' });
                    return;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (activeIndex >= 0) items[activeIndex].classList.remove('active');
                    activeIndex = (activeIndex - 1 + items.length) % items.length;
                    items[activeIndex].classList.add('active');
                    items[activeIndex].scrollIntoView({ block: 'nearest' });
                    return;
                }
            }

            if (inp === receiverInput && hasSuggestions && e.key === 'Enter') {
                const activeItem = receiverSuggestions.querySelector('li.active');
                if (activeItem) {
                    e.preventDefault();
                    receiverInput.value = activeItem.getAttribute('data-name') || activeItem.textContent;
                    receiverInput.classList.remove('invalid');
                    receiverSuggestions.innerHTML = '';
                    const firstRowInput = tbody.querySelector('.item-input');
                    if (firstRowInput) firstRowInput.focus();
                    return;
                }
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                if (inp === receiverInput) {
                    clearIfUnlisted(receiverInput, 'receiver');
                    receiverSuggestions.innerHTML = '';
                    const firstRowInput = tbody.querySelector('.item-input');
                    if (firstRowInput) firstRowInput.focus();
                } else if (idx + 1 < headerInputs.length) {
                    headerInputs[idx + 1].focus();
                }
            }
        });
    });

    function updateSerialNumbers() {
        const rows = Array.from(tbody.querySelectorAll('tr'));
        rows.forEach((row, index) => {
            const slCell = row.querySelector('.sl-cell');
            if (slCell) slCell.textContent = index + 1;
        });
    }

    function ensureTrailingEmptyRow() {
        const rows = Array.from(tbody.querySelectorAll('tr'));
        if (rows.length === 0) {
            addRow();
            return;
        }
        const lastRow = rows[rows.length - 1];
        const lastItemVal = (lastRow.querySelector('.item-input')?.value || '').trim();
        const lastQtyVal = (lastRow.querySelector('.qty-input')?.value || '').trim();
        if (lastItemVal || lastQtyVal) {
            addRow();
        }
    }

    function addRow(prefill = {}) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="sl-cell"></td>
            <td style="position: relative;">
                <input type="text" class="item-input" placeholder="Search item..." autocomplete="off" value="${prefill.item || ''}">
                <ul class="suggestions-box item-suggestions"></ul>
            </td>
            <td><input type="number" class="qty-input" step="any" min="0" placeholder="0" value="${prefill.qty ?? ''}"></td>
            <td><input type="text" class="unit-input readonly-input" readonly value="${prefill.unit || ''}"></td>
            <td style="position: relative;">
                <input type="text" class="eqp-input eqp-uppercase" placeholder="Search equipment..." autocomplete="off" value="${prefill.equipment || ''}">
                <ul class="suggestions-box eqp-suggestions"></ul>
            </td>
            <td><input type="text" class="hr-input" placeholder="Hr" value="${prefill.hrMeter || ''}"></td>
            <td><input type="text" class="erp-input" placeholder="ERP No" value="${prefill.erpIssue || ''}"></td>
            <td><input type="text" class="rem-input" placeholder="Remarks" value="${prefill.remarks || ''}"></td>
            <td><button type="button" class="delete-btn" title="Remove row">✕</button></td>
        `;

        tbody.appendChild(tr);
        updateSerialNumbers();

        const itemInput = tr.querySelector('.item-input');
        const itemSugBox = tr.querySelector('.item-suggestions');
        const qtyInput = tr.querySelector('.qty-input');
        const unitInput = tr.querySelector('.unit-input');
        const eqpInput = tr.querySelector('.eqp-input');
        const eqpSugBox = tr.querySelector('.eqp-suggestions');
        const hrInput = tr.querySelector('.hr-input');
        const erpInput = tr.querySelector('.erp-input');
        const remInput = tr.querySelector('.rem-input');
        const delBtn = tr.querySelector('.delete-btn');

        function applyProductMatch(prod) {
            if (!prod) return;
            itemInput.value = prod.name;
            unitInput.value = prod.unit;
            tr.dataset.firebaseKey = prod.firebaseKey;
            tr.dataset.maxStock = prod.stock;
            itemInput.classList.remove('invalid');
            itemSugBox.innerHTML = '';
            ensureTrailingEmptyRow();
        }

        function renderItemSuggestions() {
            const q = itemInput.value.trim().toLowerCase();
            const matches = productDatabase.filter(p => !q || p.name.toLowerCase().includes(q));
            itemSugBox.innerHTML = '';
            if (!matches.length) return;

            matches.slice(0, 20).forEach((prod, idx) => {
                const li = document.createElement('li');
                if (idx === 0) li.classList.add('active');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = prod.name;

                const stockSpan = document.createElement('span');
                stockSpan.className = 'stock-tag';
                stockSpan.textContent = `Stock: ${formatStockValue(prod.stock)} ${prod.unit}`;

                li.appendChild(nameSpan);
                li.appendChild(stockSpan);

                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    applyProductMatch(prod);
                    qtyInput.focus();
                });

                itemSugBox.appendChild(li);
            });
        }

        function renderEqpSuggestions() {
            const q = toUpperClean(eqpInput.value).trim();
            const matches = equipmentDatabase.filter(eq => {
                const label = formatEquipmentLabel(eq);
                return !q || label.includes(q) || eq.code.includes(q) || eq.name.includes(q);
            });

            eqpSugBox.innerHTML = '';
            if (!matches.length) return;

            matches.slice(0, 20).forEach((eq, idx) => {
                const label = formatEquipmentLabel(eq);
                const li = document.createElement('li');
                if (idx === 0) li.classList.add('active');
                li.textContent = label;

                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    eqpInput.value = label;
                    eqpInput.classList.remove('invalid');
                    eqpSugBox.innerHTML = '';
                    hrInput.focus();
                });

                eqpSugBox.appendChild(li);
            });
        }

        function bindSuggestionNav(inputEl, sugBox, renderFn, onPick, nextFocusEl) {
            inputEl.addEventListener('input', () => {
                if (inputEl === itemInput) {
                    delete tr.dataset.firebaseKey;
                    delete tr.dataset.maxStock;
                    unitInput.value = '';
                }
                renderFn();
                ensureTrailingEmptyRow();
            });

            inputEl.addEventListener('focus', renderFn);

            inputEl.addEventListener('keydown', function(e) {
                const items = Array.from(sugBox.querySelectorAll('li'));
                if (items.length > 0 && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
                    e.preventDefault();
                    let activeIdx = items.findIndex(li => li.classList.contains('active'));
                    if (activeIdx >= 0) items[activeIdx].classList.remove('active');
                    activeIdx = e.key === 'ArrowDown'
                        ? (activeIdx + 1) % items.length
                        : (activeIdx - 1 + items.length) % items.length;
                    items[activeIdx].classList.add('active');
                    items[activeIdx].scrollIntoView({ block: 'nearest' });
                    return;
                }

                if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeItem = sugBox.querySelector('li.active');
                    if (activeItem) {
                        onPick(activeItem);
                    }
                    sugBox.innerHTML = '';
                    if (nextFocusEl) nextFocusEl.focus();
                }
            });
        }

        bindSuggestionNav(
            itemInput,
            itemSugBox,
            renderItemSuggestions,
            (activeItem) => {
                const chosenName = activeItem.firstChild?.textContent?.trim();
                const prod = productDatabase.find(p => p.name === chosenName);
                if (prod) applyProductMatch(prod);
            },
            qtyInput
        );

        itemInput.addEventListener('blur', () => {
            setTimeout(() => {
                itemSugBox.innerHTML = '';
                const val = itemInput.value.trim();
                if (!val) {
                    unitInput.value = '';
                    delete tr.dataset.firebaseKey;
                    delete tr.dataset.maxStock;
                    return;
                }
                const matched = productDatabase.find(p => p.name.toLowerCase() === val.toLowerCase());
                if (matched) {
                    applyProductMatch(matched);
                } else {
                    itemInput.value = '';
                    unitInput.value = '';
                    delete tr.dataset.firebaseKey;
                    delete tr.dataset.maxStock;
                }
            }, 150);
        });

        bindSuggestionNav(
            eqpInput,
            eqpSugBox,
            renderEqpSuggestions,
            (activeItem) => {
                eqpInput.value = activeItem.textContent.trim();
                eqpInput.classList.remove('invalid');
            },
            hrInput
        );

        eqpInput.addEventListener('blur', () => {
            setTimeout(() => {
                eqpSugBox.innerHTML = '';
                clearIfUnlisted(eqpInput, 'equipment');
            }, 150);
        });

        [qtyInput, hrInput, erpInput, remInput].forEach((inp, i, arr) => {
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (i + 1 < arr.length) {
                        arr[i + 1].focus();
                    } else {
                        ensureTrailingEmptyRow();
                        const nextRow = tr.nextElementSibling;
                        if (nextRow) nextRow.querySelector('.item-input')?.focus();
                    }
                }
            });
        });

        qtyInput.addEventListener('input', () => {
            qtyInput.classList.remove('invalid');
            ensureTrailingEmptyRow();
        });

        delBtn.addEventListener('click', () => {
            tr.remove();
            updateSerialNumbers();
            ensureTrailingEmptyRow();
        });

        if (prefill.item) {
            const matched = productDatabase.find(p => p.name.toLowerCase() === prefill.item.trim().toLowerCase());
            if (matched) {
                applyProductMatch(matched);
            }
        }
    }

    // Excel Upload Handler
    document.getElementById('excelFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

                if (!rows.length) {
                    showCustomPopup("Empty Sheet", "No rows found in the selected Excel file.", false);
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(r => {
                    const itemName = (r.Item || r.item || r['Item Name'] || '').toString().trim();
                    const qtyVal = r.Quanty ?? r.Quantity ?? r.qty ?? '';
                    const eqpVal = toUpperClean(r.Equipment || r.equipment || '').trim();
                    const hrVal = (r['Hr meter'] || r.Hr || r.hrMeter || '').toString().trim();
                    const erpVal = (r['ERP Issue'] || r.ERP || r.erpIssue || '').toString().trim();
                    const remVal = (r.Remarks || r.remarks || '').toString().trim();

                    if (itemName || qtyVal !== '') {
                        addRow({
                            item: itemName,
                            qty: qtyVal,
                            equipment: eqpVal,
                            hrMeter: hrVal,
                            erpIssue: erpVal,
                            remarks: remVal
                        });
                    }
                });

                ensureTrailingEmptyRow();
                showCustomPopup("Excel Loaded", `Loaded ${rows.length} row(s) from "${file.name}".`);
            } catch (err) {
                console.error("Excel parse error:", err);
                showCustomPopup("Excel Error", "Could not read Excel file: " + err.message, false);
            } finally {
                e.target.value = '';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // Submit Stock Issue (Flat structure directly under each Firebase push ID)
    document.getElementById('saveBtn').addEventListener('click', async function() {
        const saveBtn = this;
        const dateVal = document.getElementById('entryDate').value.trim();
        const indentVal = document.getElementById('entryIndent').value.trim();
        const receiverCheck = validateAgainstDatabase(receiverInput.value, 'receiver');

        if (!dateVal) {
            showCustomPopup("Validation Error", "Please select a Date.", false);
            return;
        }
        if (!receiverCheck.valid) {
            receiverInput.classList.add('invalid');
            showCustomPopup("Validation Error", "Please select a valid Receiver from the list or add a new receiver.", false);
            return;
        }

        const dataRows = Array.from(tbody.querySelectorAll('tr')).filter(tr => {
            const item = (tr.querySelector('.item-input')?.value || '').trim();
            const qty = (tr.querySelector('.qty-input')?.value || '').trim();
            return item !== '' || qty !== '';
        });

        if (!dataRows.length) {
            showCustomPopup("Validation Error", "Please add at least one item row before submitting.", false);
            return;
        }

        const validatedRows = [];
        for (let i = 0; i < dataRows.length; i++) {
            const tr = dataRows[i];
            const itemInput = tr.querySelector('.item-input');
            const qtyInput = tr.querySelector('.qty-input');
            const unitInput = tr.querySelector('.unit-input');
            const eqpInput = tr.querySelector('.eqp-input');
            const hrInput = tr.querySelector('.hr-input');
            const erpInput = tr.querySelector('.erp-input');
            const remInput = tr.querySelector('.rem-input');

            const itemName = itemInput.value.trim();
            const qtyNum = parseFloat(qtyInput.value);
            const firebaseKey = tr.dataset.firebaseKey;
            const maxStock = parseFloat(tr.dataset.maxStock ?? '0');

            const matchedProd = productDatabase.find(p => p.name.toLowerCase() === itemName.toLowerCase());
            if (!matchedProd) {
                itemInput.classList.add('invalid');
                showCustomPopup("Validation Error", `Row ${i + 1}: Select a valid stock item.`, false);
                return;
            }

            if (isNaN(qtyNum) || qtyNum <= 0) {
                qtyInput.classList.add('invalid');
                showCustomPopup("Validation Error", `Row ${i + 1}: Quantity must be greater than 0.`, false);
                return;
            }

            const available = firebaseKey ? maxStock : matchedProd.stock;
            if (qtyNum > available) {
                qtyInput.classList.add('invalid');
                showCustomPopup("Insufficient Stock", `Row ${i + 1}: Requested ${qtyNum} ${matchedProd.unit}, but only ${formatStockValue(available)} available.`, false);
                return;
            }

            let eqpValue = "";
            if (eqpInput.value.trim()) {
                const eqpCheck = validateAgainstDatabase(eqpInput.value, 'equipment');
                if (!eqpCheck.valid) {
                    eqpInput.classList.add('invalid');
                    showCustomPopup("Validation Error", `Row ${i + 1}: Equipment not found in equipment_list.`, false);
                    return;
                }
                eqpValue = eqpCheck.value;
            }

            validatedRows.push({
                firebaseKey: matchedProd.firebaseKey,
                itemName: matchedProd.name,
                quantity: qtyNum,
                unit: unitInput.value.trim() || matchedProd.unit,
                equipment: eqpValue,
                hrMeter: hrInput.value.trim(),
                erpIssue: erpInput.value.trim(),
                remarks: remInput.value.trim()
            });
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "Submitting...";

        try {
            const issueNo = await generate5DigitIssueNo();
            const createdAt = new Date().toISOString();

            // Post each row as a flat record directly under stock_issue/{firebaseId}
            const updates = {};
            for (const row of validatedRows) {
                const newPushKey = db.ref('stock_issue').push().key;
                updates[`stock_issue/${newPushKey}`] = {
                    issueNo: issueNo,
                    issueDate: dateVal,
                    indentNo: indentVal,
                    receiver: receiverCheck.value,
                    itemName: row.itemName,
                    quantity: row.quantity,
                    unit: row.unit,
                    equipment: row.equipment,
                    hrMeter: row.hrMeter,
                    erpIssue: row.erpIssue,
                    remarks: row.remarks,
                    createdAt: createdAt
                };
            }

            await db.ref().update(updates);

            // Deduct issued quantity from stock_summary
            for (const row of validatedRows) {
                const stockRef = db.ref(`stock_summary/${row.firebaseKey}/stock`);
                await stockRef.transaction((currentStock) => {
                    const curr = parseFloat(currentStock) || 0;
                    const next = curr - row.quantity;
                    return next < 0 ? 0 : next;
                });
            }

            await fetchAvailableStock();
            tbody.innerHTML = '';
            document.getElementById('entryIndent').value = '';
            receiverInput.value = '';
            addRow();

            showCustomPopup("Stock Issued", `${validatedRows.length} item(s) saved and stock summary updated!`, true, issueNo);
        } catch (err) {
            console.error("Submit error:", err);
            showCustomPopup("Submission Error", "Failed to save stock issue: " + err.message, false);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Submit";
        }
    });

    window.addEventListener('DOMContentLoaded', async () => {
        await fetchAvailableStock();
        listenToReceiverList();
        listenToEquipmentList();
        addRow();
    });
</script>
</body>
</html>
